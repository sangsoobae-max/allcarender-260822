<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CALENDAR SHARE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-through-custom { text-decoration: line-through; color: #64748b; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#070a12] text-slate-100 min-h-screen flex flex-col items-center justify-start p-3">

    <!-- 1. 로그인 화면 (이전 오리지널 디자인 복원) -->
    <div id="auth-container" class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-2xl mt-24">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-400">CALENDAR SHARE</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">이메일 (아이디)</label>
                <input type="email" id="login-email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">비밀번호</label>
                <input type="password" id="login-password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">로그인</button>
            <div class="flex justify-between text-xs mt-3">
                <button type="button" onclick="openSignupModal()" class="text-blue-400 hover:underline">회원가입</button>
            </div>
        </form>
    </div>

    <!-- 2. 메인 대시보드 화면 -->
    <div id="app-container" class="hidden w-full max-w-[1400px] bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-2xl space-y-3">
        
        <!-- 상단 헤더 -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div class="flex items-center gap-3">
                <h2 id="welcome-msg" class="text-sm font-bold text-slate-200">배상수님 환영합니다!</h2>
                <span id="user-grade-badge" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-blue-400 border border-slate-700">등급: 정회원</span>
            </div>
            <div class="flex gap-2 items-center">
                <button onclick="startVoiceRecognition()" id="mic-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 border border-slate-700">
                    🎤 <span id="mic-text">음성 입력</span>
                </button>
                <button onclick="openEventModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">+ 일정 등록</button>
                <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs border border-slate-700">로그아웃</button>
            </div>
        </div>

        <!-- 메인 그리드 (오리지널 3:1 비율) -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            
            <!-- 중앙 메인 캘린더 영역 (3칸) -->
            <div id="calendar-wrapper" class="lg:col-span-3 bg-slate-900/50 p-3 rounded-xl border border-slate-800 flex flex-col">
                
                <!-- 캘린더 컨트롤 -->
                <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
                    <button onclick="changeMonth(-1)" id="prev-month-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs border border-slate-700 text-slate-300 font-medium flex items-center gap-1">
                        &lt; <span id="prev-month-label">9월 달력</span>
                    </button>
                    
                    <div class="flex items-center gap-2">
                        <select id="select-year" onchange="onYearMonthChange()" class="bg-slate-800 border border-slate-700 text-white text-xs rounded px-2.5 py-1 font-bold focus:outline-none"></select>
                        <select id="select-month" onchange="onYearMonthChange()" class="bg-slate-800 border border-slate-700 text-white text-xs rounded px-2.5 py-1 font-bold focus:outline-none"></select>
                        <button onclick="goToday()" class="bg-cyan-700 hover:bg-cyan-600 text-white px-2.5 py-1 rounded text-xs font-semibold">오늘</button>
                        
                        <!-- 뷰 모드 선택 (년/월/일) -->
                        <select id="view-mode-select" onchange="changeViewMode()" class="bg-slate-800 border border-slate-700 text-blue-400 text-xs rounded px-2.5 py-1 font-bold focus:outline-none ml-2">
                            <option value="month">월간 뷰</option>
                            <option value="year">년간 뷰</option>
                            <option value="day">일간 뷰</option>
                        </select>
                    </div>

                    <button onclick="changeMonth(1)" id="next-month-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs border border-slate-700 text-slate-300 font-medium flex items-center gap-1">
                        <span id="next-month-label">11월 달력</span> &gt;
                    </button>
                </div>

                <!-- 뷰 컨테이너 -->
                <div id="calendar-view-container" class="flex-1 flex flex-col">
                    <div id="calendar-header-row" class="grid grid-cols-7 text-center bg-slate-800/80 text-xs font-bold text-slate-300 py-2 rounded-t-lg border border-slate-700">
                        <span class="text-red-400">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-400">토</span>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-px bg-slate-800 text-sm flex-1 min-h-[500px] rounded-b-lg overflow-hidden border-x border-b border-slate-700"></div>
                </div>

                <p class="text-[11px] text-slate-400 text-center mt-2">💡 날짜를 **더블클릭**하면 해당 일정이 등록되며, 등록된 일정 바를 클릭하면 수정할 수 있습니다.</p>
            </div>

            <!-- 우측 전체 일정 (1칸) -->
            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800 flex flex-col h-full">
                <h3 class="text-xs font-bold text-slate-300 mb-2.5 flex items-center justify-between">
                    <span>등록된 전체 일정</span>
                    <span id="event-count-badge" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-blue-400 border border-slate-700">3개</span>
                </h3>
                <div id="event-list-container" class="space-y-2 overflow-y-auto max-h-[520px] text-xs flex-1 pr-1"></div>
            </div>
        </div>

        <!-- DO IT (금일 해야할 일) 영역 -->
        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
            <h3 class="text-xs font-bold text-slate-300 mb-2">DO IT (금일 해야할 일)</h3>
            <div id="do-it-container" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
        </div>
    </div>

    <!-- 3. 회원가입 모달 -->
    <div id="signup-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl w-full max-w-md shadow-2xl">
            <h3 class="text-lg font-bold text-slate-200 mb-4">회원가입</h3>
            <form id="signup-form" class="space-y-3">
                <input type="text" id="su-name" placeholder="이름" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs">
                <input type="number" id="su-age" placeholder="나이" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs">
                <select id="su-gender" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs">
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                </select>
                <input type="text" id="su-phone" placeholder="연락처" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs">
                <input type="email" id="su-email" placeholder="이메일 (아이디)" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs">
                <input type="password" id="su-password" placeholder="비밀번호" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs">
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeSignupModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold">가입하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 4. 일정 등록 모달 -->
    <div id="event-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl w-full max-w-lg shadow-2xl">
            <h3 id="event-modal-title" class="text-lg font-bold text-slate-200 mb-4">새 일정 등록</h3>
            <form id="event-form" class="space-y-3">
                <input type="hidden" id="ev-id">
                <input type="text" id="ev-title" placeholder="일정 제목" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">시작일</label>
                        <input type="date" id="ev-start-date" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">마감일</label>
                        <input type="date" id="ev-end-date" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">반복 주기</label>
                        <select id="ev-repeat" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                            <option value="없음">반복 없음</option>
                            <option value="매월">매월</option>
                            <option value="매년">매년</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">위치</label>
                        <input type="text" id="ev-location" placeholder="장소 입력" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                    </div>
                </div>

                <textarea id="ev-memo" placeholder="메모" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-xs"></textarea>
                
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">참여자 선택</label>
                    <select id="ev-participants" multiple class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-white text-xs h-16"></select>
                </div>

                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">오픈 범위</label>
                    <div class="flex gap-4 text-xs text-slate-300 bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="정회원" class="accent-blue-500"> 정회원</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="준회원" class="accent-blue-500"> 준회원</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="비회원" class="accent-blue-500"> 비회원</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="개인" checked class="accent-blue-500"> 개인</label>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeEventModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbythl7-IhPeGGXnOSBabGscdBefHV4e3u5SVWKg4hfh7tfjRl1EaTaRreBGZij2EPKv/exec";
        let currentUser = null;
        let currentDate = new Date();
        let eventsData = [];
        let allUsersData = [];
        let draggedEventId = null;
        let currentViewMode = 'month';

        function openSignupModal() { document.getElementById('signup-modal').classList.remove('hidden'); }
        function closeSignupModal() { document.getElementById('signup-modal').classList.add('hidden'); document.getElementById('signup-form').reset(); }

        function openEventModal(selectedDate = null, eventToEdit = null) {
            const modalTitle = document.getElementById('event-modal-title');
            const form = document.getElementById('event-form');
            form.reset();
            document.getElementById('ev-id').value = '';

            const select = document.getElementById('ev-participants');
            select.innerHTML = '';
            allUsersData.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.email;
                opt.innerText = `${u.name} (${u.email})`;
                select.appendChild(opt);
            });

            if (eventToEdit) {
                modalTitle.innerText = "일정 수정";
                document.getElementById('ev-id').value = eventToEdit.id;
                document.getElementById('ev-title').value = eventToEdit.title;
                document.getElementById('ev-start-date').value = eventToEdit.startDate;
                document.getElementById('ev-end-date').value = eventToEdit.endDate;
                document.getElementById('ev-repeat').value = eventToEdit.repeatCycle || '없음';
                document.getElementById('ev-location').value = eventToEdit.location || '';
                document.getElementById('ev-memo').value = eventToEdit.memo || '';
                
                const parts = (eventToEdit.participants || "").split(', ').map(s => s.trim());
                for (let opt of select.options) {
                    if (parts.includes(opt.value)) opt.selected = true;
                }
                
                document.querySelectorAll('input[name="openRange"]').forEach(r => {
                    if (r.value === eventToEdit.openRange) r.checked = true;
                });
            } else {
                modalTitle.innerText = "새 일정 등록";
                const todayStr = selectedDate || new Date().toISOString().split('T')[0];
                document.getElementById('ev-start-date').value = todayStr;
                document.getElementById('ev-end-date').value = todayStr;
            }

            document.getElementById('event-modal').classList.remove('hidden');
        }

        function closeEventModal() { document.getElementById('event-modal').classList.add('hidden'); }

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                action: 'register',
                name: document.getElementById('su-name').value,
                age: document.getElementById('su-age').value,
                gender: document.getElementById('su-gender').value,
                phone: document.getElementById('su-phone').value,
                email: document.getElementById('su-email').value,
                password: document.getElementById('su-password').value
            };
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            alert(result.message);
            if (result.status === 'success') closeSignupModal();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                action: 'login',
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === 'success') {
                    currentUser = result.user;
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('welcome-msg').innerText = `${currentUser.name}님 환영합니다!`;
                    document.getElementById('user-grade-badge').innerText = `등급: ${currentUser.grade}`;
                    initYearMonthSelectors();
                    loadEvents();
                    renderToDoNotes();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('로그인 중 오류가 발생했습니다.');
            }
        });

        function logout() {
            currentUser = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }

        function initYearMonthSelectors() {
            const yearSel = document.getElementById('select-year');
            const monthSel = document.getElementById('select-month');
            
            yearSel.innerHTML = '';
            for (let y = 2024; y <= 2030; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = `${y}년`;
                yearSel.appendChild(opt);
            }

            monthSel.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m - 1;
                opt.innerText = `${m}월`;
                monthSel.appendChild(opt);
            }
            updateSelectorsUI();
        }

        function updateSelectorsUI() {
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth();
            document.getElementById('select-year').value = y;
            document.getElementById('select-month').value = m;

            const prevDate = new Date(y, m - 1, 1);
            const nextDate = new Date(y, m + 1, 1);
            document.getElementById('prev-month-label').innerText = `${prevDate.getMonth() + 1}월 달력`;
            document.getElementById('next-month-label').innerText = `${nextDate.getMonth() + 1}월 달력`;
        }

        function onYearMonthChange() {
            const y = parseInt(document.getElementById('select-year').value);
            const m = parseInt(document.getElementById('select-month').value);
            currentDate = new Date(y, m, 1);
            updateSelectorsUI();
            renderCalendar();
            renderEventList();
        }

        function changeMonth(direction) {
            if (currentViewMode === 'year') {
                currentDate.setFullYear(currentDate.getFullYear() + direction);
            } else if (currentViewMode === 'day') {
                currentDate.setDate(currentDate.getDate() + direction);
            } else {
                currentDate.setMonth(currentDate.getMonth() + direction);
            }
            updateSelectorsUI();
            renderCalendar();
            renderEventList();
        }

        function goToday() {
            currentDate = new Date();
            updateSelectorsUI();
            renderCalendar();
            renderEventList();
        }

        function changeViewMode() {
            currentViewMode = document.getElementById('view-mode-select').value;
            renderCalendar();
        }

        function renderCalendar() {
            if (currentViewMode === 'month') {
                renderMainMonthCalendar();
            } else if (currentViewMode === 'year') {
                renderYearCalendar();
            } else if (currentViewMode === 'day') {
                renderDayCalendar();
            }
        }

        function renderMainMonthCalendar() {
            const container = document.getElementById('calendar-view-container');
            container.innerHTML = `
                <div id="calendar-header-row" class="grid grid-cols-7 text-center bg-slate-800/80 text-xs font-bold text-slate-300 py-2 rounded-t-lg border border-slate-700">
                    <span class="text-red-400">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-400">토</span>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-px bg-slate-800 text-sm flex-1 min-h-[500px] rounded-b-lg overflow-hidden border-x border-b border-slate-700"></div>
            `;

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const prevLastDate = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calendar-grid');

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevLastDate - i;
                const prevMonth = month === 0 ? 11 : month - 1;
                const prevYear = month === 0 ? year - 1 : year;
                const dateStr = `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                grid.appendChild(createCell(dayNum, dateStr, true));
            }

            for (let day = 1; day <= lastDate; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                grid.appendChild(createCell(day, dateStr, false));
            }

            const totalCells = grid.children.length;
            const nextDaysCount = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
            for (let day = 1; day <= nextDaysCount; day++) {
                const nextMonth = month === 11 ? 0 : month + 1;
                const nextYear = month === 11 ? year + 1 : year;
                const dateStr = `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                grid.appendChild(createCell(day, dateStr, true));
            }
        }

        function createCell(dayNum, dateStr, isOtherMonth) {
            const cell = document.createElement('div');
            cell.className = `bg-slate-900 p-1.5 min-h-[85px] border border-slate-800 flex flex-col cursor-pointer hover:bg-slate-800/60 transition ${isOtherMonth ? 'opacity-30' : ''}`;
            
            cell.innerHTML = `<span class="font-bold text-xs ${isOtherMonth ? 'text-slate-600' : 'text-slate-300'} mb-1">${dayNum}</span>`;

            cell.addEventListener('dragover', (e) => e.preventDefault());
            cell.addEventListener('drop', async (e) => {
                e.preventDefault();
                if (!draggedEventId) return;
                const evToMove = eventsData.find(ev => ev.id === draggedEventId);
                if (!evToMove) return;

                const oldStart = new Date(evToMove.startDate);
                const newStart = new Date(dateStr);
                const diffTime = newStart - oldStart;
                const oldEnd = new Date(evToMove.endDate);
                const newEnd = new Date(oldEnd.getTime() + diffTime);

                evToMove.startDate = dateStr;
                evToMove.endDate = newEnd.toISOString().split('T')[0];

                const payload = {
                    action: 'updateEvent',
                    id: evToMove.id,
                    title: evToMove.title,
                    startDate: evToMove.startDate,
                    endDate: evToMove.endDate,
                    participants: evToMove.participants || "",
                    memo: evToMove.memo || "",
                    repeatCycle: evToMove.repeatCycle || "없음",
                    location: evToMove.location || "",
                    openRange: evToMove.openRange || "개인",
                    author: evToMove.author || currentUser.name,
                    authorEmail: evToMove.authorEmail || currentUser.email
                };

                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                draggedEventId = null;
                await loadEvents();
            });

            cell.addEventListener('dblclick', () => {
                const [y, m] = dateStr.split('-');
                currentDate = new Date(y, m - 1, 1);
                updateSelectorsUI();
                renderCalendar();
                openEventModal(dateStr);
            });

            const visibleEvents = eventsData.filter(ev => {
                if (!hasEventOnDate(ev, dateStr)) return false;
                if (currentUser.grade === '관리자') return true;
                if (ev.openRange === '개인') {
                    return ev.authorEmail === currentUser.email || (ev.participants && ev.participants.includes(currentUser.email));
                }
                if (ev.openRange === '정회원') return ['관리자', '정회원'].includes(currentUser.grade);
                if (ev.openRange === '준회원') return ['관리자', '정회원', '준회원'].includes(currentUser.grade);
                if (ev.openRange === '비회원') return true;
                return false;
            });

            visibleEvents.forEach(ev => {
                const isStart = (ev.startDate === dateStr);
                const isEnd = (ev.endDate === dateStr);
                const isMultiDay = ev.startDate !== ev.endDate;

                const evDiv = document.createElement('div');
                evDiv.draggable = true;
                
                let barStyle = "bg-emerald-600 hover:bg-emerald-500 text-white";
                if (ev.isCompleted) barStyle = "bg-slate-700 text-slate-400 line-through";

                let roundClass = "rounded";
                if (isMultiDay) {
                    if (isStart && !isEnd) roundClass = "rounded-l rounded-r-none mr-[-4px]";
                    else if (!isStart && !isEnd) roundClass = "rounded-none mx-[-4px]";
                    else if (!isStart && isEnd) roundClass = "rounded-r rounded-l-none ml-[-4px]";
                }

                evDiv.className = `text-[11px] ${barStyle} font-medium px-1.5 py-0.5 mb-1 truncate shadow flex items-center justify-between cursor-grab ${roundClass}`;
                evDiv.innerHTML = `<span>${ev.title}</span>`;

                evDiv.addEventListener('dragstart', () => { draggedEventId = ev.id; });
                evDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEventModal(null, ev);
                });

                cell.appendChild(evDiv);
            });

            return cell;
        }

        function renderYearCalendar() {
            const container = document.getElementById('calendar-view-container');
            const year = currentDate.getFullYear();
            container.innerHTML = `<div class="grid grid-cols-3 gap-3 overflow-y-auto max-h-[520px] p-2 flex-1"></div>`;
            const grid = container.querySelector('div');

            for (let m = 0; m < 12; m++) {
                const monthBox = document.createElement('div');
                monthBox.className = 'bg-slate-900 p-2 rounded-lg border border-slate-800';
                monthBox.innerHTML = `<h4 class="text-xs font-bold text-blue-400 mb-1 text-center">${m + 1}월</h4>`;
                
                const miniGrid = document.createElement('div');
                miniGrid.className = 'grid grid-cols-7 gap-1 text-center text-[10px] text-slate-300';
                ['일','월','화','수','목','금','토'].forEach(d => miniGrid.innerHTML += `<span class="text-slate-500 font-bold">${d}</span>`);

                const firstDay = new Date(year, m, 1).getDay();
                const lastDate = new Date(year, m + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) miniGrid.innerHTML += `<span></span>`;
                for (let d = 1; d <= lastDate; d++) {
                    const dateStr = `${year}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const hasEv = eventsData.some(ev => hasEventOnDate(ev, dateStr));
                    miniGrid.innerHTML += `<span class="py-0.5 rounded cursor-pointer ${hasEv ? 'bg-emerald-600 text-white font-bold' : 'hover:bg-slate-800'}" onclick="jumpToMonth(${m})">${d}</span>`;
                }
                monthBox.appendChild(miniGrid);
                grid.appendChild(monthBox);
            }
        }

        function jumpToMonth(m) {
            currentDate = new Date(currentDate.getFullYear(), m, 1);
            currentViewMode = 'month';
            document.getElementById('view-mode-select').value = 'month';
            updateSelectorsUI();
            renderCalendar();
        }

        function renderDayCalendar() {
            const container = document.getElementById('calendar-view-container');
            const dateStr = currentDate.toISOString().split('T')[0];
            
            container.innerHTML = `
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-800 flex-1 overflow-y-auto space-y-3">
                    <h3 class="text-sm font-bold text-blue-400 border-b border-slate-800 pb-2">${dateStr} 상세 일정</h3>
                    <div id="day-events-list" class="space-y-2"></div>
                </div>
            `;

            const dayEventsContainer = document.getElementById('day-events-list');
            const dayEvents = eventsData.filter(ev => hasEventOnDate(ev, dateStr));

            if (dayEvents.length === 0) {
                dayEventsContainer.innerHTML = '<p class="text-slate-500 text-xs">등록된 일정이 없습니다.</p>';
                return;
            }

            dayEvents.forEach(ev => {
                const div = document.createElement('div');
                div.className = 'bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center cursor-pointer hover:border-blue-500';
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-xs text-slate-200">${ev.title}</h4>
                        <p class="text-[10px] text-slate-400">기간: ${ev.startDate} ~ ${ev.endDate}</p>
                    </div>
                    <span class="text-[10px] bg-slate-900 text-blue-400 px-2 py-0.5 rounded border border-slate-700">${ev.openRange}</span>
                `;
                div.addEventListener('click', () => openEventModal(null, ev));
                dayEventsContainer.appendChild(div);
            });
        }

        function hasEventOnDate(ev, targetDateStr) {
            if (!ev.startDate || !ev.endDate) return false;
            return targetDateStr >= ev.startDate && targetDateStr <= ev.endDate;
        }

        async function loadEvents() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getEvents`);
                const result = await res.json();
                if (result.status === 'success') {
                    eventsData = result.events || [];
                    allUsersData = result.users || [];
                    renderCalendar();
                    renderEventList();
                }
            } catch (err) {
                console.error('일정 로드 실패', err);
            }
        }

        function renderEventList() {
            const container = document.getElementById('event-list-container');
            container.innerHTML = '';

            const currentYearMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;

            let myEvents = eventsData.filter(ev => {
                if (!ev.startDate.startsWith(currentYearMonth) && !ev.endDate.startsWith(currentYearMonth)) return false;
                if (currentUser.grade === '관리자') return true;
                if (ev.openRange === '개인') {
                    return ev.authorEmail === currentUser.email || (ev.participants && ev.participants.includes(currentUser.email));
                }
                if (ev.openRange === '정회원' && ['관리자', '정회원'].includes(currentUser.grade)) return true;
                if (ev.openRange === '준회원' && ['관리자', '정회원', '준회원'].includes(currentUser.grade)) return true;
                if (ev.openRange === '비회원') return true;
                return false;
            });

            myEvents.sort((a, b) => a.startDate.localeCompare(b.startDate));
            document.getElementById('event-count-badge').innerText = `${myEvents.length}개`;

            if (myEvents.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center py-4 text-xs">일정이 없습니다.</p>';
                return;
            }

            myEvents.forEach(ev => {
                const div = document.createElement('div');
                div.className = 'bg-slate-900 p-2.5 rounded-lg border border-slate-800 hover:border-slate-700 cursor-pointer';
                div.innerHTML = `<p class="font-bold text-slate-200 text-xs flex justify-between">
                                    <span class="${ev.isCompleted ? 'line-through text-slate-500' : ''}">${ev.title}</span>
                                    <span class="text-[10px] text-cyan-400 font-normal">[${ev.repeatCycle || '없음'}]</span>
                                 </p>
                                 <p class="text-[10px] text-slate-400 mt-1">📅 ${ev.startDate} ~ ${ev.endDate}</p>`;
                
                div.addEventListener('click', () => openEventModal(null, ev));
                container.appendChild(div);
            });
        }

        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const eventId = document.getElementById('ev-id').value;
            const colleagueSelect = document.getElementById('ev-participants');
            const selectedParticipants = Array.from(colleagueSelect.selectedOptions).map(opt => opt.value).join(', ');
            const openRange = document.querySelector('input[name="openRange"]:checked').value;
            const startDate = document.getElementById('ev-start-date').value;
            const endDate = document.getElementById('ev-end-date').value;
            const title = document.getElementById('ev-title').value;

            const payload = {
                action: eventId ? 'updateEvent' : 'addEvent',
                id: eventId,
                title: title,
                startDate: startDate,
                endDate: endDate,
                participants: selectedParticipants,
                memo: document.getElementById('ev-memo').value,
                repeatCycle: document.getElementById('ev-repeat').value,
                location: document.getElementById('ev-location').value,
                openRange: openRange,
                author: currentUser.name,
                authorEmail: currentUser.email
            };

            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                alert(result.message);
                if (result.status === 'success') {
                    closeEventModal();
                    await loadEvents();
                }
            } catch (err) {
                alert('일정 저장 중 오류가 발생했습니다.');
            }
        });

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("음성 인식을 지원하지 않는 브라우저입니다.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            document.getElementById('mic-text').innerText = "듣는중...";
            recognition.start();

            recognition.onresult = (event) => {
                document.getElementById('mic-text').innerText = "음성 입력";
                openEventModal();
                document.getElementById('ev-title').value = event.results[0][0].transcript;
            };
            recognition.onerror = () => { document.getElementById('mic-text').innerText = "음성 입력"; };
            recognition.onspeechend = () => { document.getElementById('mic-text').innerText = "음성 입력"; recognition.stop(); };
        }

        function renderToDoNotes() {
            const container = document.getElementById('do-it-container');
            container.innerHTML = '';
            const todayStr = new Date().toISOString().split('T')[0];

            for (let i = 1; i <= 4; i++) {
                const savedText = localStorage.getItem(`todo_text_${i}`) || '';
                const savedCheck = localStorage.getItem(`todo_check_${i}`) === 'true';

                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center gap-2 bg-slate-900 p-2 rounded-lg border border-slate-800';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = savedCheck;
                checkbox.className = 'w-4 h-4 accent-blue-500 cursor-pointer';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = savedText;
                input.placeholder = `할 일 ${i}번을 입력하세요`;
                input.className = `w-full bg-transparent text-xs text-white focus:outline-none ${savedCheck ? 'line-through-custom' : ''}`;

                checkbox.addEventListener('change', async () => {
                    localStorage.setItem(`todo_check_${i}`, checkbox.checked);
                    input.classList.toggle('line-through-custom', checkbox.checked);
                });

                input.addEventListener('blur', () => {
                    localStorage.setItem(`todo_text_${i}`, input.value);
                });

                wrapper.appendChild(checkbox);
                wrapper.appendChild(input);
                container.appendChild(wrapper);
            }
        }
    </script>
</body>
</html>
