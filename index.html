<!DOCTYPE html>
<html>
  <head>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
      #mini-calendars { display: flex; justify-content: space-between; margin-bottom: 20px; }
      .mini-cal { width: 45%; border: 1px solid #ccc; padding: 10px; }
    </style>
  </head>
  <body>
    <!-- 1. 미니 달력 영역 -->
    <div id="mini-calendars">
      <div id="prev-cal" class="mini-cal">이전 달 달력</div>
      <div id="next-cal" class="mini-cal">다음 달 달력</div>
    </div>
    
    <!-- 2. 메인 달력 영역 -->
    <div id='calendar'></div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,multiMonthYear' // 3. 년/월/일 뷰 선택
          },
          events: function(info, successCallback) {
            google.script.run.withSuccessHandler(successCallback).getEvents(info.startStr, info.endStr);
          }
        });
        calendar.render();
      });
    </script>
  </body>
</html>
