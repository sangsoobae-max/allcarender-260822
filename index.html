<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CALENDAR SHARE & BACKOFFICE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-through-custom { text-decoration: line-through; color: #64748b; }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. 로그인 화면 -->
    <div id="auth-container" class="w-full max-w-md bg-slate-900/90 backdrop-blur border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <h1 class="text-3xl font-extrabold text-center mb-6 bg-gradient-to-r from-blue-400 via-indigo-400 to-cyan-400 bg-clip-text text-transparent">CALENDAR SHARE</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">이메일 (아이디)</label>
                <input type="email" id="login-email" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">비밀번호</label>
                <input type="password" id="login-password" required class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg shadow-blue-900/40">로그인</button>
            <div class="flex justify-between text-sm mt-4">
                <button type="button" onclick="openSignupModal()" class="text-blue-400 hover:underline">회원가입</button>
            </div>
        </form>
    </div>

    <!-- 2. 메인 대시보드 화면 -->
    <div id="app-container" class="hidden w-full max-w-7xl bg-slate-900/90 backdrop-blur border border-slate-800 p-6 rounded-2xl shadow-2xl space-y-6">
        <!-- 상단 헤더 -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div class="flex items-center gap-4">
                <h2 id="welcome-msg" class="text-xl font-bold text-blue-400">환영합니다!</h2>
                <span id="user-grade-badge" class="text-xs px-3 py-1 rounded-full bg-blue-950 text-blue-300 border border-blue-700 font-semibold">등급</span>
            </div>
            <div class="flex gap-2 items-center">
                <!-- 음성 인식 마이크 버튼 -->
                <button onclick="startVoiceRecognition()" id="mic-btn" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 shadow-md transition" title="음성으로 일정 입력">
                    🎤 <span id="mic-text">음성 입력</span>
                </button>
                <button onclick="openEventModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md">+ 일정 등록</button>
                <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-sm">로그아웃</button>
            </div>
        </div>

        <!-- 메인 콘텐츠 그리드 -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 중앙 메인 캘린더 영역 (3칸) -->
            <div class="lg:col-span-3 bg-slate-800/40 p-4 rounded-xl border border-slate-700/60 flex flex-col">
                <!-- 캘린더 상단 컨트롤 -->
                <div class="flex flex-wrap justify-between items-center mb-4 gap-2 bg-slate-900/60 p-3 rounded-lg border border-slate-700/50">
                    <div class="flex items-center gap-2">
                        <button onclick="changeMonth(-1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs border border-slate-700">&lt;</button>
                        <div id="mini-prev-box" class="cursor-pointer text-xs text-slate-400 hover:text-blue-400 font-semibold" onclick="goToTargetMonth(-1)">지난달</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="select-year" onchange="onYearMonthChange()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded px-2 py-1 font-bold focus:outline-none focus:border-blue-500"></select>
                        <select id="select-month" onchange="onYearMonthChange()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded px-2 py-1 font-bold focus:outline-none focus:border-blue-500"></select>
                        <button onclick="goToday()" class="bg-cyan-700 hover:bg-cyan-600 text-white px-3 py-1 rounded text-xs font-semibold">오늘</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <div id="mini-next-box" class="cursor-pointer text-xs text-slate-400 hover:text-blue-400 font-semibold" onclick="goToTargetMonth(1)">다음달</div>
                        <button onclick="changeMonth(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs border border-slate-700">&gt;</button>
                    </div>
                </div>

                <!-- 캘린더 본문 헤더 -->
                <div class="grid grid-cols-7 text-center bg-slate-800 text-xs font-bold text-slate-300 py-2.5 rounded-t-lg border-x border-t border-slate-700">
                    <span class="text-red-400">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-400">토</span>
                </div>
                <!-- 그리드 (행 높이 확보) -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-px bg-slate-700/50 text-sm flex-1 min-h-[580px] rounded-b-lg overflow-hidden border border-slate-700"></div>
                <p class="text-[11px] text-slate-400 text-center mt-2">💡 날짜를 **더블클릭**하면 해당 일정이 등록/수정되며, 등록된 일정 바를 클릭하면 수정할 수 있습니다.</p>
            </div>

            <!-- 우측 사이드 (전체 일정 리스트) -->
            <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/60 flex flex-col h-full">
                <h3 class="text-sm font-bold text-blue-400 mb-3 flex items-center justify-between">
                    <span>등록된 전체 일정</span>
                    <span id="event-count-badge" class="text-[10px] bg-blue-950 px-2 py-0.5 rounded text-blue-300">0개</span>
                </h3>
                <div id="event-list-container" class="space-y-2.5 overflow-y-auto max-h-[570px] text-xs flex-1 pr-1"></div>
            </div>
        </div>

        <!-- 하단 DO IT 노트 영역 -->
        <div class="bg-slate-800/40 p-5 rounded-xl border border-slate-700/60">
            <h3 class="text-md font-bold text-cyan-400 mb-3">DO IT (금일 해야할 일)</h3>
            <div id="do-it-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>
    </div>

    <!-- 3. 회원가입 모달 -->
    <div id="signup-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold text-blue-400 mb-4">회원가입</h3>
            <form id="signup-form" class="space-y-3">
                <input type="text" id="su-name" placeholder="이름" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                <input type="number" id="su-age" placeholder="나이" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                <select id="su-gender" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                </select>
                <input type="text" id="su-phone" placeholder="연락처" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                <input type="email" id="su-email" placeholder="이메일 (아이디)" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                <input type="password" id="su-password" placeholder="비밀번호" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeSignupModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold">가입하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 4. 일정 등록 및 수정 모달 -->
    <div id="event-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-lg shadow-2xl">
            <h3 id="event-modal-title" class="text-xl font-bold text-blue-400 mb-4">새 일정 등록</h3>
            <form id="event-form" class="space-y-3">
                <input type="hidden" id="ev-id">
                <input type="text" id="ev-title" placeholder="일정 제목" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">시작일 (월/일)</label>
                        <input type="date" id="ev-start-date" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">마감일 (월/일)</label>
                        <input type="date" id="ev-end-date" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">반복 주기</label>
                        <select id="ev-repeat" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                            <option value="없음">반복 없음</option>
                            <option value="매월">매월 반복</option>
                            <option value="매년">매년 반복</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">위치</label>
                        <input type="text" id="ev-location" placeholder="장소 입력" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-xs">
                    </div>
                </div>

                <textarea id="ev-memo" placeholder="메모 및 내용" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm"></textarea>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">참여자 선택 (관련자 이메일 발송 연동)</label>
                    <select id="ev-participants" multiple class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-white text-xs h-16"></select>
                    <span class="text-[10px] text-slate-500">Ctrl(Cmd)을 누르고 여러 명을 선택할 수 있습니다.</span>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">오픈 범위</label>
                    <div class="flex gap-4 text-xs text-slate-300 bg-slate-800/50 p-2 rounded-lg border border-slate-700">
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="정회원" class="accent-blue-500"> 정회원</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="준회원" class="accent-blue-500"> 준회원</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="비회원" class="accent-blue-500"> 비회원</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="openRange" value="개인" checked class="accent-blue-500"> 개인</label>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeEventModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwv5bHYBl4A6EPwxd_cr4E8jOhCnHN8txN1Rl2N-6Plu-m-Io2AXAYcnG8ImvFIuKg/exec";
        let currentUser = null;
        let currentDate = new Date();
        let eventsData = [];
        let allUsersData = [];

        function openSignupModal() { document.getElementById('signup-modal').classList.remove('hidden'); }
        function closeSignupModal() { document.getElementById('signup-modal').classList.add('hidden'); document.getElementById('signup-form').reset(); }

        function openEventModal(selectedDate = null, eventToEdit = null) {
            const modalTitle = document.getElementById('event-modal-title');
            const form = document.getElementById('event-form');
            form.reset();
            document.getElementById('ev-id').value = '';

            const select = document.getElementById('ev-participants');
            select.innerHTML = '';
            allUsersData.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.email;
                opt.innerText = `${u.name} (${u.email})`;
                select.appendChild(opt);
            });

            if (eventToEdit) {
                modalTitle.innerText = "일정 수정";
                document.getElementById('ev-id').value = eventToEdit.id;
                document.getElementById('ev-title').value = eventToEdit.title;
                document.getElementById('ev-start-date').value = eventToEdit.startDate;
                document.getElementById('ev-end-date').value = eventToEdit.endDate;
                document.getElementById('ev-repeat').value = eventToEdit.repeatCycle || '없음';
                document.getElementById('ev-location').value = eventToEdit.location || '';
                document.getElementById('ev-memo').value = eventToEdit.memo || '';
                
                const parts = (eventToEdit.participants || "").split(', ').map(s => s.trim());
                for (let opt of select.options) {
                    if (parts.includes(opt.value)) opt.selected = true;
                }
                
                document.querySelectorAll('input[name="openRange"]').forEach(r => {
                    if (r.value === eventToEdit.openRange) r.checked = true;
                });
            } else {
                modalTitle.innerText = "새 일정 등록";
                const todayStr = selectedDate || new Date().toISOString().split('T')[0];
                document.getElementById('ev-start-date').value = todayStr;
                document.getElementById('ev-end-date').value = todayStr;
            }

            document.getElementById('event-modal').classList.remove('hidden');
        }

        function closeEventModal() { document.getElementById('event-modal').classList.add('hidden'); }

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                action: 'register',
                name: document.getElementById('su-name').value,
                age: document.getElementById('su-age').value,
                gender: document.getElementById('su-gender').value,
                phone: document.getElementById('su-phone').value,
                email: document.getElementById('su-email').value,
                password: document.getElementById('su-password').value
            };
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            alert(result.message);
            if (result.status === 'success') closeSignupModal();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                action: 'login',
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === 'success') {
                    currentUser = result.user;
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('welcome-msg').innerText = `${currentUser.name}님 환영합니다!`;
                    document.getElementById('user-grade-badge').innerText = `등급: ${currentUser.grade}`;
                    initYearMonthSelectors();
                    loadEvents();
                    renderDoItNotes();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('로그인 중 오류가 발생했습니다.');
            }
        });

        function logout() {
            currentUser = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }

        function initYearMonthSelectors() {
            const yearSel = document.getElementById('select-year');
            const monthSel = document.getElementById('select-month');
            
            yearSel.innerHTML = '';
            for (let y = 2024; y <= 2030; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = `${y}년`;
                yearSel.appendChild(opt);
            }

            monthSel.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m - 1;
                opt.innerText = `${m}월`;
                monthSel.appendChild(opt);
            }
            updateSelectorsUI();
        }

        function updateSelectorsUI() {
            document.getElementById('select-year').value = currentDate.getFullYear();
            document.getElementById('select-month').value = currentDate.getMonth();
            document.getElementById('mini-prev-box').innerText = `${new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1).getMonth() + 1}월 달력`;
            document.getElementById('mini-next-box').innerText = `${new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1).getMonth() + 1}월 달력`;
        }

        function onYearMonthChange() {
            const y = parseInt(document.getElementById('select-year').value);
            const m = parseInt(document.getElementById('select-month').value);
            currentDate = new Date(y, m, 1);
            renderMainCalendar();
            updateSelectorsUI();
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            updateSelectorsUI();
            renderMainCalendar();
        }

        function goToday() {
            currentDate = new Date();
            updateSelectorsUI();
            renderMainCalendar();
        }

        function goToTargetMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            updateSelectorsUI();
            renderMainCalendar();
        }

        function renderMainCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const prevLastDate = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // 이전 달 여백 날짜 채우기
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevLastDate - i;
                const prevMonth = month === 0 ? 11 : month - 1;
                const prevYear = month === 0 ? year - 1 : year;
                const dateStr = `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                grid.appendChild(createCell(dayNum, dateStr, true));
            }

            // 이번 달 날짜 채우기
            for (let day = 1; day <= lastDate; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                grid.appendChild(createCell(day, dateStr, false));
            }

            // 다음 달 여백 채우기 (총 35 또는 42칸 맞춤)
            const totalCells = grid.children.length;
            const nextDaysCount = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
            for (let day = 1; day <= nextDaysCount; day++) {
                const nextMonth = month === 11 ? 0 : month + 1;
                const nextYear = month === 11 ? year + 1 : year;
                const dateStr = `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                grid.appendChild(createCell(day, dateStr, true));
            }
        }

        function createCell(dayNum, dateStr, isOtherMonth) {
            const cell = document.createElement('div');
            // 일정이 있는 날은 바탕색과 확실히 구분되는 다크 블루 틴트 컬러 적용
            cell.className = `bg-slate-900/90 p-1.5 min-h-[95px] border border-slate-800/80 flex flex-col cursor-pointer hover:bg-slate-800 transition ${isOtherMonth ? 'opacity-30' : ''}`;
            
            cell.innerHTML = `<span class="font-bold text-xs ${isOtherMonth ? 'text-slate-500' : 'text-slate-300'} mb-1">${dayNum}</span>`;

            // 날짜 더블클릭 시 해당 날짜로 신규 일정 등록 창 열기
            cell.addEventListener('dblclick', () => {
                const [y, m] = dateStr.split('-');
                currentDate = new Date(y, m - 1, 1);
                updateSelectorsUI();
                renderMainCalendar();
                openEventModal(dateStr);
            });

            cell.addEventListener('click', () => {
                const [y, m] = dateStr.split('-');
                if (parseInt(m) - 1 !== currentDate.getMonth()) {
                    currentDate = new Date(y, m - 1, 1);
                    updateSelectorsUI();
                    renderMainCalendar();
                }
            });

            // 해당 날짜에 포함되는 가시적 일정 필터링 (반복 주기 포함 계산)
            const visibleEvents = eventsData.filter(ev => {
                if (!hasEventOnDate(ev, dateStr)) return false;
                if (currentUser.grade === '관리자') return true;
                if (ev.openRange === '개인') {
                    return ev.authorEmail === currentUser.email || (ev.participants && ev.participants.includes(currentUser.email));
                }
                if (ev.openRange === '정회원') return ['관리자', '정회원'].includes(currentUser.grade);
                if (ev.openRange === '준회원') return ['관리자', '정회원', '준회원'].includes(currentUser.grade);
                if (ev.openRange === '비회원') return true;
                return false;
            });

            // 일정이 있는 칸은 옅은 파란색 바(Bar)와 월/일, 제목, 내용 표시
            visibleEvents.forEach(ev => {
                cell.classList.remove('bg-slate-900/90');
                cell.classList.add('bg-blue-950/40', 'border-blue-900/60'); // 옅은 파란색 배경 강조

                const evDiv = document.createElement('div');
                evDiv.className = 'text-[11px] bg-blue-600 hover:bg-blue-500 text-white font-medium px-1.5 py-0.5 rounded mb-1 truncate shadow flex items-center justify-between';
                
                // 연도와 시간 제외, 월/일 및 제목/내용 표기
                const startM = ev.startDate.split('-')[1];
                const startD = ev.startDate.split('-')[2];
                const endM = ev.endDate.split('-')[1];
                const endD = ev.endDate.split('-')[2];
                const dateText = (ev.startDate === ev.endDate) ? `${startM}/${startD}` : `${startM}/${startD}~${endM}/${endD}`;

                evDiv.innerHTML = `<span>📅 ${dateText} <strong>${ev.title}</strong></span>`;
                
                // 클릭 시 해당 일정 수정 모달 오픈
                evDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEventModal(null, ev);
                });

                cell.appendChild(evDiv);
            });

            return cell;
        }

        // 반복 주기 및 시작~끝 날짜 포함 여부 확인 함수
        function hasEventOnDate(ev, targetDateStr) {
            if (!ev.startDate || !ev.endDate) return false;
            
            if (ev.repeatCycle === '없음') {
                return targetDateStr >= ev.startDate && targetDateStr <= ev.endDate;
            } else if (ev.repeatCycle === '매월') {
                const targetDay = parseInt(targetDateStr.split('-')[2]);
                const startDay = parseInt(ev.startDate.split('-')[2]);
                return targetDay === startDay && targetDateStr >= ev.startDate;
            } else if (ev.repeatCycle === '매년') {
                const targetMMDD = targetDateStr.slice(5);
                const startMMDD = ev.startDate.slice(5);
                return targetMMDD === startMMDD && targetDateStr >= ev.startDate;
            }
            return false;
        }

        async function loadEvents() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getEvents`);
                const result = await res.json();
                if (result.status === 'success') {
                    eventsData = result.events || [];
                    allUsersData = result.users || [];
                    document.getElementById('event-count-badge.innerText').innerText = `${eventsData.length}개`;
                    renderMainCalendar();
                    renderEventList();
                }
            } catch (err) {
                console.error('일정 로드 실패', err);
            }
        }

        function renderEventList() {
            const container = document.getElementById('event-list-container');
            container.innerHTML = '';

            const myEvents = eventsData.filter(ev => {
                if (currentUser.grade === '관리자') return true;
                if (ev.openRange === '개인') {
                    return ev.authorEmail === currentUser.email || (ev.participants && ev.participants.includes(currentUser.email));
                }
                if (ev.openRange === '정회원' && ['관리자', '정회원'].includes(currentUser.grade)) return true;
                if (ev.openRange === '준회원' && ['관리자', '정회원', '준회원'].includes(currentUser.grade)) return true;
                if (ev.openRange === '비회원') return true;
                return false;
            });

            document.getElementById('event-count-badge').innerText = `${myEvents.length}개`;

            if (myEvents.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center py-6">등록된 일정이 없습니다.</p>';
                return;
            }

            myEvents.forEach(ev => {
                const div = document.createElement('div');
                div.className = 'bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60 hover:border-blue-500/50 cursor-pointer transition';
                div.innerHTML = `<p class="font-bold text-blue-300 flex justify-between"><span>${ev.title}</span><span class="text-[10px] text-cyan-400 font-normal">[${ev.repeatCycle}]</span></p>
                                 <p class="text-[10px] text-slate-400 mt-1">📅 ${ev.startDate} ~ ${ev.endDate}</p>
                                 ${ev.location ? `<p class="text-[10px] text-slate-400">📍 ${ev.location}</p>` : ''}
                                 ${ev.memo ? `<p class="text-[10px] text-slate-400 truncate">📝 ${ev.memo}</p>` : ''}`;
                
                div.addEventListener('click', () => {
                    openEventModal(null, ev);
                });
                container.appendChild(div);
            });
        }

        // 일정 등록 및 수정 폼 제출
        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const eventId = document.getElementById('ev-id').value;
            const colleagueSelect = document.getElementById('ev-participants');
            const selectedParticipants = Array.from(colleagueSelect.selectedOptions).map(opt => opt.value).join(', ');
            const openRange = document.querySelector('input[name="openRange"]:checked').value;
            const startDate = document.getElementById('ev-start-date').value;
            const endDate = document.getElementById('ev-end-date').value;
            const title = document.getElementById('ev-title').value;

            // 요구사항: 일정을 입력할 때 해당일에 다른 일정이 우선 있으면 알림
            const conflictingEvents = eventsData.filter(ev => {
                if (eventId && ev.id === eventId) return false; // 수정 중인 본인은 제외
                return startDate >= ev.startDate && startDate <= ev.endDate;
            });

            if (conflictingEvents.length > 0) {
                const confirmProceed = confirm(`⚠️ 경고: 선택하신 시작일(${startDate})에 이미 등록된 일정("${conflictingEvents[0].title}")이 있습니다. 그래도 등록하시겠습니까?`);
                if (!confirmProceed) return;
            }

            const payload = {
                action: eventId ? 'updateEvent' : 'addEvent',
                id: eventId,
                title: title,
                startDate: startDate,
                endDate: endDate,
                participants: selectedParticipants,
                memo: document.getElementById('ev-memo').value,
                repeatCycle: document.getElementById('ev-repeat').value,
                location: document.getElementById('ev-location').value,
                openRange: openRange,
                author: currentUser.name,
                authorEmail: currentUser.email
            };

            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                alert(result.message);
                if (result.status === 'success') {
                    closeEventModal();
                    await loadEvents();
                    
                    // 요구사항: 일정이 수정되면 그에 해당하는 날짜로 자동 이동
                    const [y, m] = startDate.split('-');
                    currentDate = new Date(y, m - 1, 1);
                    updateSelectorsUI();
                    renderMainCalendar();
                }
            } catch (err) {
                alert('일정 저장 중 오류가 발생했습니다.');
            }
        });

        // 10. 음성 인식 일정 입력 기능 구현
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 이용해 주세요.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const micBtnText = document.getElementById('mic-text');
            micBtnText.innerText = "듣고 있어요...";

            recognition.start();

            recognition.onresult = async (event) => {
                const speechText = event.results[0][0].transcript;
                micBtnText.innerText = "음성 입력";
                
                // 음성 텍스트를 파싱하여 제목에 반영하고 모달 창 오픈
                openEventModal();
                document.getElementById('ev-title').value = speechText;
                alert(`🎤 인식된 음성 내용: "${speechText}"\n내용을 확인하고 저장해 주세요.`);
            };

            recognition.onerror = () => {
                micBtnText.innerText = "음성 입력";
                alert("음성 인식 중 오류가 발생했습니다. 다시 시도해 주세요.");
            };

            recognition.onspeechend = () => {
                micBtnText.innerText = "음성 입력";
                recognition.stop();
            };
        }

        // 하단 DO IT 체크리스트 노트
        function renderDoItNotes() {
            const container = document.getElementById('do-it-container');
            container.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                const savedText = localStorage.getItem(`doit_text_${i}`) || '';
                const savedCheck = localStorage.getItem(`doit_check_${i}`) === 'true';

                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center gap-2 bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/50';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = savedCheck;
                checkbox.className = 'w-4 h-4 accent-blue-500 cursor-pointer';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = savedText;
                input.placeholder = `할 일 ${i}번을 입력하세요`;
                input.className = `w-full bg-transparent text-xs text-white focus:outline-none ${savedCheck ? 'line-through-custom' : ''}`;

                checkbox.addEventListener('change', () => {
                    localStorage.setItem(`doit_check_${i}`, checkbox.checked);
                    input.classList.toggle('line-through-custom', checkbox.checked);
                });

                input.addEventListener('input', () => {
                    localStorage.setItem(`doit_text_${i}`, input.value);
                });

                wrapper.appendChild(checkbox);
                wrapper.appendChild(input);
                container.appendChild(wrapper);
            }
        }
    </script>
